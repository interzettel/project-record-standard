version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:17"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      routine-compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:23"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      routine-compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:29"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      routine-compatible-updates:
        update-types: [minor, patch]
