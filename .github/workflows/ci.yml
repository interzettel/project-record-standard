name: Verify and publish the standard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install the documentation build dependency
        run: python3 -m pip install --require-hashes -r requirements-site.txt
      - name: Install locked DOM test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the source records
        run: PYTHONPATH=src python3 -m project_record check --config examples/projects.json
      - name: Exercise the composite action
        uses: ./
        with:
          config: examples/projects.json
          output: .record-build
          audience: public
      - name: Test the Python runtime and site boundaries
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Check the versioned agent skill suite
        run: PYTHONPATH=src python3 tools/check_skills.py
      - name: Compare browser calculations with the public records
        run: npm test
      - name: Check the brand colour roles
        run: python3 tools/check_palette.py
      - name: Build the public website
        run: PYTHONPATH=src python3 tools/build_site.py --records .record-build --output .site
      - name: Verify the README projection
        run: PYTHONPATH=src python3 tools/check_readme.py --records .record-build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: .site
          retention-days: 7
  reusable:
    uses: ./.github/workflows/record-build.yml
    with:
      config: examples/projects.json
      output: .reusable-build
      audience: public
      toolkit-path: .
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, reusable]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified public artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
