name: Reusable project record build
on:
  workflow_call:
    inputs:
      config:
        required: true
        type: string
      output:
        default: .project-record-build
        type: string
      only:
        default: ''
        type: string
      audience:
        default: owner
        type: string
      python-version:
        description: Exact supported Python for this workflow; independent of vendored toolkit files
        default: '3.15.2'
        type: string
      toolkit-path:
        description: Repository-relative directory containing the vendored toolkit
        default: tools/project-record-standard
        type: string
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Build from the toolkit in the calling repository
        env:
          PROJECT_RECORD_TOOLKIT: ${{ inputs.toolkit-path }}
          PROJECT_RECORD_CONFIG: ${{ inputs.config }}
          PROJECT_RECORD_OUTPUT: ${{ inputs.output }}
          PROJECT_RECORD_AUDIENCE: ${{ inputs.audience }}
          PROJECT_RECORD_ONLY: ${{ inputs.only }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          workspace = Path.cwd().resolve()
          toolkit = (workspace / os.environ['PROJECT_RECORD_TOOLKIT']).resolve()
          if not toolkit.is_relative_to(workspace):
              raise SystemExit('The toolkit must be inside the checkout')
          subprocess.run([sys.executable, str(toolkit / 'tools/run_action.py')], check=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-record
          path: ${{ inputs.output }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
