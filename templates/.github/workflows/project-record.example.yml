name: Project record
on:
  pull_request:
    paths:
      - 'progress/**'
      - '.repo-status/**'
      - 'tools/project-record-standard/**'
      - '.github/workflows/project-record.yml'
  push:
    branches: [main]
    paths:
      - 'progress/**'
      - '.repo-status/**'
      - 'tools/project-record-standard/**'
      - '.github/workflows/project-record.yml'
permissions:
  contents: read
jobs:
  tracking:
    uses: ./.github/workflows/record-build.yml
    with:
      config: progress/project-record.json
      output: .project-record-build
      audience: owner
